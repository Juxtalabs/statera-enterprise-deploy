# One company's Statera installation (Phase 31 WP8; enhancement E6):
# the App, PostgreSQL, and — unless another reverse proxy already owns ports
# 80/443 — Caddy for HTTPS. Lives in /opt/statera with its `.env`; `install.sh`
# writes both.
#
#   statera <command>      runs `statera <command>` inside the App container
#   statera update         backup → pull → migrate → health check → rollback
#
# The App image is pinned by digest in `.env` (`STATERA_IMAGE`, from the
# release manifest) — never by a moving tag (enhancement E6). No Redis (WP1).
# The updater runs the scheduled update (off until the server administrator
# sets a window with `statera update --schedule`).
#
# Offsite backup (enhancement E3): PostgreSQL runs **our** image
# (postgres:16 + pgBackRest, pinned by digest in the release manifest like
# the App: `STATERA_POSTGRES_IMAGE`; without the backup it behaves as the
# plain image), and when `BACKUP_S3_BUCKET` is set both
# containers receive the repository settings as `PGBACKREST_*` variables —
# no configuration file anywhere, so changing the bucket, the credential or
# the retention is `.env` + a restart. The PostgreSQL container also runs
# `pgbackrest server` (TLS) so the App can command a backup; the certificates
# come from `./pgbackrest`, written by install.sh. An install without the
# offsite backup is untouched: `BACKUP_ARCHIVE_MODE=off`, no stanza, no TLS.

name: ${STATERA_PROJECT:-statera}

x-pgbackrest-repo: &pgbackrest-repo
  PGBACKREST_STANZA: statera
  PGBACKREST_REPO1_TYPE: s3
  PGBACKREST_REPO1_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
  PGBACKREST_REPO1_S3_REGION: ${BACKUP_S3_REGION:-}
  PGBACKREST_REPO1_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
  PGBACKREST_REPO1_S3_KEY_TYPE: shared
  PGBACKREST_REPO1_S3_KEY: ${BACKUP_S3_ACCESS_KEY_ID:-}
  PGBACKREST_REPO1_S3_KEY_SECRET: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
  PGBACKREST_REPO1_PATH: ${PGBACKREST_REPO1_PATH:-/pgbackrest}
  PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
  PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_DB_CIPHER_PASS:-}
  PGBACKREST_REPO1_RETENTION_FULL_TYPE: count
  PGBACKREST_REPO1_RETENTION_FULL: ${BACKUP_RETENTION_COUNT:-7}
  PGBACKREST_REPO1_BUNDLE: "y"
  PGBACKREST_START_FAST: "y"
  PGBACKREST_ARCHIVE_PUSH_QUEUE_MAX: ${BACKUP_WAL_QUEUE_MAX:-4GiB}
  PGBACKREST_LOG_LEVEL_CONSOLE: info
  PGBACKREST_LOG_LEVEL_FILE: "off"
  PGBACKREST_ALLOW_ROOT: "y"

services:
  postgres:
    image: ${STATERA_POSTGRES_IMAGE:?set by install.sh}
    restart: unless-stopped
    environment:
      <<: *pgbackrest-repo
      POSTGRES_DB: statera
      POSTGRES_USER: statera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set by install.sh}
      # What `postgres-entrypoint.sh` gates the TLS server on: the service
      # has no `env_file`, so these two must be mapped explicitly, like the
      # `PGBACKREST_*` block above.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_ARCHIVE_MODE: ${BACKUP_ARCHIVE_MODE:-off}
      PGBACKREST_PG1_PATH: /var/lib/postgresql/data
      PGBACKREST_PG1_PORT: "5432"
      PGBACKREST_PG1_USER: statera
      PGBACKREST_TLS_SERVER_ADDRESS: "*"
      PGBACKREST_TLS_SERVER_PORT: "8432"
      PGBACKREST_TLS_SERVER_CERT_FILE: /etc/pgbackrest/server.crt
      PGBACKREST_TLS_SERVER_KEY_FILE: /etc/pgbackrest/server.key
      PGBACKREST_TLS_SERVER_CA_FILE: /etc/pgbackrest/ca.crt
      PGBACKREST_TLS_SERVER_AUTH: statera-client=statera
    # WAL archiving: on while the offsite backup is on; `archive_timeout`
    # forces a segment from a quiet cluster. An install without the backup
    # runs `archive_mode=off` and behaves exactly as before.
    command:
      - postgres
      - -c
      - archive_mode=${BACKUP_ARCHIVE_MODE:-off}
      - -c
      - archive_command=pgbackrest --stanza=statera archive-push %p
      - -c
      - archive_timeout=${BACKUP_ARCHIVE_TIMEOUT_SECONDS:-900}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # The pgBackRest TLS server's certificates (generated by install.sh).
      - ./pgbackrest:/etc/pgbackrest:ro
      # WAL spool: a lost spool is re-sent from pg_wal, never data loss.
      - pgbackrest-spool:/var/spool/pgbackrest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statera -d statera"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${STATERA_IMAGE:?set by install.sh}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      <<: *pgbackrest-repo
      DATABASE_URL: postgresql://statera:${POSTGRES_PASSWORD}@postgres:5432/statera
      # The App is the pgBackRest TLS client (E3, proved in the spike).
      PGBACKREST_PG1_PATH: /var/lib/postgresql/data
      PGBACKREST_PG1_PORT: "5432"
      PGBACKREST_PG1_USER: statera
      PGBACKREST_PG1_HOST_TYPE: tls
      PGBACKREST_PG1_HOST: postgres
      PGBACKREST_PG1_HOST_CERT_FILE: /etc/pgbackrest/client.crt
      PGBACKREST_PG1_HOST_KEY_FILE: /etc/pgbackrest/client.key
      PGBACKREST_PG1_HOST_CA_FILE: /etc/pgbackrest/ca.crt
    volumes:
      - keys:/etc/statera
      - attachments:/var/lib/statera/attachments
      - backups:/var/lib/statera/backups
      - ./pgbackrest:/etc/pgbackrest:ro
    # Behind Caddy on the bundle's network; with `--no-proxy`, published on
    # the host's loopback for the reverse proxy already there.
    ports:
      - "127.0.0.1:${STATERA_APP_PORT:-8000}:8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: ["proxy"]
    depends_on: [app]
    environment:
      STATERA_DOMAIN: ${STATERA_DOMAIN:?set by install.sh}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  updater:
    image: docker:27-cli
    restart: unless-stopped
    depends_on: [app]
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      STATERA_DIR: ${STATERA_DIR:-/opt/statera}
    working_dir: ${STATERA_DIR:-/opt/statera}
    entrypoint: ["sh", "${STATERA_DIR:-/opt/statera}/updater.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${STATERA_DIR:-/opt/statera}:${STATERA_DIR:-/opt/statera}

volumes:
  pgdata:
  keys:
  attachments:
  backups:
  pgbackrest-spool:
  caddy-data:
  caddy-config: